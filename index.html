      <script>
    function updatePSTTime() {
      const options = {
        timeZone: 'America/Los_Angeles',
        hour: 'numeric',
        minute: 'numeric',
        second: 'numeric',
        hour12: true,
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };

      const now = new Date();
      const formatter = new Intl.DateTimeFormat('en-US', options);
      const pstTime = formatter.format(now);

      document.getElementById('time').textContent = `teh time for meh: ${pstTime}`;
    }

    updatePSTTime();
    setInterval(updatePSTTime, 1000);
  </script>
