    <!-- The style.css file allows you to change the look of your web pages.

<style>
    
    body {
  background-color: #000;
}
    
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-image: url('bg.png');
  background-repeat: no-repeat;
  color: #fff;
}

.sidenav {
  height: 100%;
  width: 180px;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #300D1A;
  overflow-x: hidden;
  padding-top: 20px;
  transition: 0.3s;
}

.sidenav a {
  padding: 10px 16px;
  text-decoration: none;
  font-size: 20px;
  color: #FFDE29;
  display: block;
}

.sidenav a:hover {
  color: #FFFFFF;
}

.main {
  margin-left: 180px;
  padding: 10px;
  transition: 0.3s;
}

.hamburger {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  font-size: 30px;
  color: #FFDE29;
  cursor: pointer;
  z-index: 2;
}

@media screen and (max-width: 768px) {
  .sidenav {
    width: 0;
    padding-top: 0;
  }
  .sidenav a {
    font-size: 18px;
    padding: 8px;
  }
  .main {
    margin-left: 0;
  }
  .hamburger {
    display: block;
  }
}

body {
  background-image: url('bg.png');
  background-repeat: no-repeat;
}

    .collapsible {

    .content {

/* Content Box */
.container {
    background: rgba(255, 255, 255, 0.1); /* Slight transparency */
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    padding: 20px;
    color: white;
    font-size: 18px;
    text-align: center;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.25);
}

/* Adding a soft text shadow */
h1, h2, h3, h4, h5, h6, p {
    text-shadow: 4px 4px 5px rgba(0, 0, 0, 0.5); /* Soft shadow for readability */
}

    /* Container for the dropdown */
    .dropdown-container {
      position: relative;
      display: inline-block;
    }

    /* Button styling */
    .dropdown-button {
      background: linear-gradient(to bottom, #3c0059, #7001a3);
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s;
    }
    
    .dropdown-button:hover {
      background-color: rgba(0, 120, 215, 1);
    }

    /* Smaller dropdown content with Aero aesthetics */
    .dropdown-content {
      display: none;
      position: absolute;
      background: rgba(255, 255, 255, 0.2); /* Slight transparency */
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 8px;
      margin-top: 5px;
      width: 200px;  /* Smaller size */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      opacity: 0; /* Make it invisible by default */
      transition: opacity 0.3s ease; /* Smooth transition for fade effect */
  }
    }

    /* Style for the GIFs inside the dropdown */
    .dropdown-content img {
      display: block;
      width: 100%;  /* Resizes to fit */
      border-radius: 4px;
      margin-bottom: 6px;
    }

</style>
