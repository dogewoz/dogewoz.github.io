<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<h1>dogewoz.github.io</h1>
  <div id="feed"></div>

  <script>
  
      function decodeHTML(str) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<!doctype html><body>${str}`, 'text/html');
      return doc.body.textContent;
    }
  
  
    fetch("https://api.rss2json.com/v1/api.json?rss_url=https://dogewoz.tumblr.com/rss")
      .then(response => response.json())
      .then(data => {
        let html = "<ul>";
        data.items.slice(0, 5).forEach(item => {
          html += `<li><a href="${item.link}">${item.title}</a></li>`;
        });
        html += "</ul>";
        document.getElementById("feed").innerHTML = html;
      })
      .catch(err => {
        console.error("RSS load failed:", err);
        document.getElementById("feed").textContent = "Couldn't load Tumblr posts.";
      });
  </script>
</body>
</html>
