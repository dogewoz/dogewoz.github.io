        <script>
        // Function to generate random "glitchy" text
        function getRandomTitle() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
            let randomTitle = '';
            for (let i = 0; i < 10; i++) {
                randomTitle += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return randomTitle;
        }

        // Function to start the "corruption" effect
        function corruptTitle() {
            // Save the original title to restore later
            const originalTitle = document.title;

            // Set an interval to rapidly change the title
            const intervalId = setInterval(function() {
                // Randomly alternate between glitchy title and the original
                document.title = Math.random() > 0.5 ? getRandomTitle() : originalTitle;
            }, 5); // Changes the title every 100 milliseconds

            // Stop the corruption after a certain period (e.g., 5 seconds)
            setTimeout(function() {
                clearInterval(intervalId);
                document.title = originalTitle; // Restore original title
            }, 960000000); // Duration
        }

        // Start the title corruption when the page loads
        window.onload = corruptTitle;
    </script>
