    <!-- The style.css file allows you to change the look of your web pages.

    <link href="/psi.css" rel="stylesheet" type="text/css" media="all">

        <script>
        // Function to generate random "glitchy" text
        function getRandomTitle() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
            let randomTitle = '';
            for (let i = 0; i < 10; i++) {
                randomTitle += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return randomTitle;
        }

        // Function to start the "corruption" effect
        function corruptTitle() {
            // Save the original title to restore later
            const originalTitle = document.title;

            // Set an interval to rapidly change the title
            const intervalId = setInterval(function() {
                // Randomly alternate between glitchy title and the original
                document.title = Math.random() > 0.5 ? getRandomTitle() : originalTitle;
            }, 5); // Changes the title every 100 milliseconds

            // Stop the corruption after a certain period (e.g., 5 seconds)
            setTimeout(function() {
                clearInterval(intervalId);
                document.title = originalTitle; // Restore original title
            }, 960000000); // Duration
        }

        // Start the title corruption when the page loads
        window.onload = corruptTitle;
    </script>
    
    
  </head>
  <body>
  <h1>color~</h1>
<p>Select my favorite color, plz <span style="color: #2e0451;"></span></p>
<input type="color" class="color-input" id="colorPicker">
<button class="btn" id="colorSubmit" disabled>Pronto!</button>

<script>
    const colorPicker = document.getElementById("colorPicker");
    const colorSubmit = document.getElementById("colorSubmit");
    const redirectUrl = "inplex.html";

    // Check the selected color
    colorPicker.addEventListener("input", function() {
        if (this.value.toLowerCase() === "#2e0451") {
            colorSubmit.disabled = false; // Enable submit button
        } else {
            colorSubmit.disabled = true; // Disable submit button
        }
    });

    // Handle color submission
    colorSubmit.addEventListener("click", function() {
        window.location.href = "inplex.html"; // Redirect to the next part
    });
</script>
