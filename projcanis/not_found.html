<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Forbidden</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    .error-container {
      max-width: 600px;
      margin: 100px auto;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .error-header {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      background-color: #eee;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }

    .error-title {
      font-size: 24px;
      font-weight: bold;
      color: red;
      margin: 20px 0;
    }

    .error-message {
      font-size: 16px;
      line-height: 1.6;
    }

    .error-footer {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-header">Server Error</div>
    <div class="error-content">
      <div class="error-title">403 - Forbidden: Access is denied.</div>
      <p class="error-message">
        You do not have permission to view this directory or page using the credentials that you supplied.
      </p>
    </div>
    <div class="error-footer">
      <p>For further assisstance, refer this matter to the Head Engineer.</p>
      <h6>... and whatever you do, do not bother the Head Librarian.</h6>
    </div>
  </div>
</body>
</html>
